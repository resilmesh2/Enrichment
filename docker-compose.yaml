services:
  resilmesh-ap-silentpush:
    hostname: "silentpush-enrichment"
    restart: unless-stopped
    env_file:
      - ".env"
    build:
      context: "./"
    healthcheck:
      test: "(ps aux | grep -i subscriber.py | grep -v grep)"
      interval: 1s
      retries: 60
    deploy:
      replicas: 2
    networks:
      - resilmesh_network
    depends_on: ["resilmesh-ap-nats"]

